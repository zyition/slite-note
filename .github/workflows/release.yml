name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install wails3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.9
          echo "$(go env GOPATH)/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set version from tag
        shell: pwsh
        # Single source of truth: the release tag (vX.Y.Z). Rewrites the
        # About-section version (store.go) and the exe metadata
        # (build/windows/info.json) before building, so a release never
        # ships a stale version.
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $store = Get-Content store.go -Raw
          $store = $store -replace 'const appVersion = "[^"]*"', "const appVersion = `"$ver`""
          Set-Content store.go -NoNewline $store
          $info = Get-Content build/windows/info.json -Raw
          $info = $info -replace '"file_version": "[^"]*"', ('"file_version": "' + $ver + '"')
          $info = $info -replace '"ProductVersion": "[^"]*"', ('"ProductVersion": "' + $ver + '"')
          Set-Content build/windows/info.json -NoNewline $info
          Write-Host "Version set to $ver"

      - name: Build
        env:
          PACKAGE_MANAGER: pnpm
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: wails3 build

      - name: Package NSIS installer (per-user)
        env:
          PACKAGE_MANAGER: pnpm
        # VERSION propagates the tag to INFO_PRODUCTVERSION so the installer
        # and the ARP registry DisplayVersion match the built exe (the stock
        # wails_tools.nsh hard-codes 0.1.0).
        run: wails3 task windows:package INSTALL_SCOPE=user VERSION=$ver

      - name: Build portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path bin\slite-note.exe -DestinationPath "bin\slite-note-${{ github.ref_name }}-windows-amd64.zip"

      - name: Extract changelog section for release body
        shell: pwsh
        # Single source of truth for the release description: the Keep a
        # Changelog section matching the tag (e.g. "## [0.2.0] - date"),
        # written verbatim to release-body.md. A release without a matching
        # section fails the job, so publishing always forces a changelog
        # entry. Bottom link-definitions ([Unreleased]: …) are excluded.
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $inSection = $false
          $out = [System.Collections.Generic.List[string]]::new()
          foreach ($line in $lines) {
              if ($line -match '^## \[') {
                  if ($inSection) { break }  # reached the next section
                  $inSection = $line -match "^## \[$([regex]::Escape($tag))\]( -.*)?$"
                  if ($inSection) { $out.Add($line) }
              }
              elseif ($inSection -and $line -match '^\[[^\]]+\]: ') { break }  # link-definitions block
              elseif ($inSection) { $out.Add($line) }
          }
          if ($out.Count -eq 0) {
              Write-Error "CHANGELOG.md has no section for version $tag - add a '## [$tag]' section (Keep a Changelog format) before releasing."
              exit 1
          }
          $body = $out -join [Environment]::NewLine
          $body += [Environment]::NewLine + [Environment]::NewLine + '---' + [Environment]::NewLine + 'Full changelog: https://github.com/zyition/slite-note/blob/main/CHANGELOG.md'
          Set-Content -Path release-body.md -Value $body -Encoding UTF8
          Write-Host "Release body extracted from CHANGELOG.md:"
          Write-Host $body

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: |
            bin/*-installer.exe
            bin/slite-note-*-windows-amd64.zip
