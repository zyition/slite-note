# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# CHANGELOG.md is generated from Conventional Commits (see docs/commits.md).
# `git-cliff -o CHANGELOG.md` rewrites it from git history; the template
# below is the git-cliff default, only commit_parsers is trimmed to decide
# which commit types are worth listing.

[changelog]
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# Render body even when there are no releases to process.
render_always = true

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
# An unconventional commit simply does not show up in the changelog.
filter_unconventional = true
# Keep commits marked as breaking (e.g. `feat!`) from being excluded.
protect_breaking_commits = true
# Order of commits in each group/release within the changelog.
sort_commits = "oldest"
# Order commits topologically instead of chronologically.
topo_order_commits = true

# Which commit types end up in the changelog. Chores, CI, build and style
# tweaks are internal noise — keep them out. Use feat/fix/perf/refactor/docs
# (and put the user-visible detail in the commit body) to get a useful
# changelog entry.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^test", group = "<!-- 4 -->Testing" },
    # Changelog housekeeping commits should never be listed as changes.
    { message = "^docs?: (changelog|update changelog)", skip = true },
    { message = "^docs", group = "<!-- 5 -->Documentation" },
    { message = "^style|^build|^ci|^chore|^revert", skip = true },
    { body = ".*security", group = "<!-- 6 -->Security" },
    { message = ".*", group = "<!-- 7 -->Other" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
